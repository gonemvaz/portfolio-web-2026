# Headers de seguridad. Se incluyen en cada location de nginx.conf porque un
# add_header dentro de un location anula los que estén definidos en server.
# "always" los envía también en respuestas de error (404, 500...).

# Qué puede cargar la página. Cualquier cosa fuera de esta lista se bloquea.
#   style-src-attr: los style="--y: ..." y style="--hab-photo: ..." del HTML
#   fuentes: Fontshare (General Sans, Zodiak) y Google Fonts (respaldo)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src-elem 'self' https://api.fontshare.com https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://cdn.fontshare.com https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
